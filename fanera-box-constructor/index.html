<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fanera Brains — каркас конструктора</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">Fanera Brains</p>
        <h1>Конструктор коробок</h1>
      </div>
      <p>Проверка каркаса. Размеры в миллиметрах. Соединение паз + шип ещё без геометрии шипов.</p>
    </header>

    <main>
      <form id="box-form">
        <fieldset>
          <legend>Размеры, мм</legend>
          <div class="mode">
            <label><input type="radio" name="dimensionMode" value="external" checked /> Внешние</label>
            <label><input type="radio" name="dimensionMode" value="internal" /> Внутренние</label>
          </div>
          <label class="field">Ширина <input name="width" type="number" min="0" step="1" value="300" required /></label>
          <label class="field">Глубина <input name="depth" type="number" min="0" step="1" value="200" required /></label>
          <label class="field">Высота <input name="height" type="number" min="0" step="1" value="100" required /></label>
        </fieldset>
        <fieldset>
          <legend>Материал</legend>
          <label class="field">Толщина <input name="thickness" type="number" min="0" step="0.1" value="4" required /></label>
        </fieldset>
        <button type="submit">Собрать</button>
        <p id="errors" class="errors" hidden></p>
      </form>

      <section class="view">
        <div id="readout" class="readout">Введите размеры и нажмите «Собрать».</div>
        <div id="sheet" class="sheet"></div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
